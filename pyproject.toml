[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phenopacket-toolkit"
version = "0.3.0"
description = "A samtools/bedtools-style command-line toolkit and library for GA4GH Phenopackets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    {name = "Tim Hearn", email = "tjh70@cam.ac.uk"},
]
keywords = ["phenopackets", "GA4GH", "HPO", "MONDO", "pedigree", "genomics", "interoperability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []   # zero-dependency core

[project.optional-dependencies]
normalise = ["hponorm>=1.0", "mondonorm>=1.0"]
fuzzy = ["rapidfuzz>=3.0"]
yaml = ["PyYAML>=6.0"]
validate = ["phenopackets>=2.0"]
all = ["hponorm>=1.0", "mondonorm>=1.0", "rapidfuzz>=3.0", "PyYAML>=6.0", "phenopackets>=2.0"]
test = ["pytest>=7.0"]

[project.scripts]
phenotk = "phenopacket_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
