[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phenopacket-toolkit"
version = "0.4.0"
description = "A samtools/bedtools-style command-line toolkit and library for GA4GH Phenopackets and pedigrees"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Tim Hearn", email = "tjh70@cam.ac.uk"},
]
keywords = ["phenopackets", "GA4GH", "HPO", "MONDO", "pedigree", "genomics", "interoperability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["pedigree-ga4gh>=1.0,<2"]

[project.optional-dependencies]
normalise = ["hponorm>=1.0", "mondonorm>=1.0"]
fuzzy = ["rapidfuzz>=3.0"]
yaml = ["PyYAML>=6.0"]
# kept so that "phenopacket-toolkit[validate]" still installs: validation is now
# done by pedigree-ga4gh, which needs nothing more
validate = []
all = ["hponorm>=1.0", "mondonorm>=1.0", "rapidfuzz>=3.0", "PyYAML>=6.0"]
test = ["pytest>=7", "hponorm>=1.0", "mondonorm>=1.0", "PyYAML>=6.0"]

[project.scripts]
phenotk = "phenopacket_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/comparativechrono/phenopacket-toolkit"
Issues = "https://github.com/comparativechrono/phenopacket-toolkit/issues"
Changelog = "https://github.com/comparativechrono/phenopacket-toolkit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
